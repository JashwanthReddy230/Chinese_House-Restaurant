<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Orders</title>
    <meta charset="UTF-8">
	
	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet">

	<!-- Font Awesome and Bootstrap Icons -->
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

	<!--icons-->
		    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />


	<!-- Libraries CSS -->
	<link th:href="@{/css/animate.min.css}" rel="stylesheet">
	<link th:href="@{/css/owl.carousel.min.css}" rel="stylesheet">
	<link th:href="@{/css/tempusdominus-bootstrap-4.min.css}" rel="stylesheet">

	<!-- Custom Bootstrap and Menu CSS -->
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
	<link th:href="@{/css/menu.css}" rel="stylesheet">

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<header>
	    <div class="position-relative p-0">
	        <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 px-lg-5 py-3 py-lg-0">
	            <a th:href="@{/index}" class="navbar-brand p-0">
	                <img th:src="@{/logo-img/Chinese House logo-svg.png}" alt="Logo">
	            </a>
	            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
	                <span class="fa fa-bars"></span>
	            </button>
				<div class="collapse navbar-collapse" id="navbarCollapse">
				                   <div class="navbar-nav ms-auto py-0 pe-4">
									<a th:href="@{/index}" class="nav-item nav-link">Home</a>
									<a th:href="@{/about}" class="nav-item nav-link">About</a>
									<a th:href="@{/menu}" class="nav-item nav-link">Menu</a>
									
									<a th:href="@{/cart}" class="nav-item nav-link"><i class="fa-solid fa-cart-shopping"></i></a>
									<a class="nav-link" th:href="${role == 'ROLE_ADMIN'} ? 'dashboard' : 'my-orders'">my orders</a>
				                   </div>
								<form th:action="@{/logout}" method="post">
									<!--  	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />-->
									  	<button class="logoutbtnbtn btn-primary py-2 px-4" type="submit">Logout</button>
									  </form>
									  
							<!--	<a th:href="@{/register}" class="btn btn-primary py-2 px-4"><i class="fa-solid fa-user"></i>Signup</a>-->
				               </div>
	        </nav>
	    </div>
	</header>
    <div class="container my-5">
        <h1 class="mb-4 text-center">My Orders</h1>

        <!-- If no orders -->
        <div th:if="${orders != null and #lists.isEmpty(orders)}" class="alert alert-info text-center">
            <p>No orders found.</p>
        </div>

        <!-- If orders exist -->
        <div th:if="${orders != null and !#lists.isEmpty(orders)}" class="table-responsive">
            <table class="table table-bordered table-striped table-hover align-middle text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Order ID</th>
                        <th>Item Name</th>
                        <th>Quantity</th>
                        <th>Total Price</th>
                        <th>Address</th>
                        <th>Order Date</th>
                        <th>Status</th>
						<th>view bill</th>
						<th>download bill</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.id}">1</td>
                        <td th:text="${order.item.dishname}">Item Name</td>
                        <td th:text="${order.quantity}">2</td>
                        <td th:text="${order.totalprice}">100.00</td>
                        <td th:text="${order.address}">123 Main St</td>
                        <td th:text="${#temporals.format(order.orderdate, 'dd MMM yyyy HH:mm')}">
                            01 Oct 2025 14:30
                        </td>
                        <td th:text="${order.status}">Pending</td>
						<td th:each="order : ${order}">
												<a th:href="@{/bill/view/{bid}(bid=${order.id})}" class="btn btn-primary">View Bill</a> 
											</td>
											<td th:each="order : ${order}">
												<a th:href="@{/bill/download/{bid}(bid=${order.id})}" class="btn btn-success">Download PDF</a>

											</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Optional: Bootstrap JS Bundle (only if using components like modals/tooltips) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

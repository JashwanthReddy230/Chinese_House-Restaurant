<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Invoice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            padding: 2rem;
            background-color: #f8f9fa;
        }
        .invoice-box {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: auto;
        }
        .table th, .table td {
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="invoice-box">
        <h2 class="text-center mb-4">Invoice</h2>

        <div th:each="b : ${bill}">
            <table class="table table-bordered table-striped">
                <tbody>
                    <tr>
                        <th>Invoice No</th>
                        <td th:text="${b.invoiceNumber}">12345</td>
                    </tr>
                    <tr>
                        <th>Customer Name</th>
                        <td th:text="${b.customerName}">Jash</td>
                    </tr>
                    <tr>
                        <th>Car</th>
                        <td th:text="${b.dishName}">maggi</td>
                    </tr>
                    <tr>
                        <th>Address</th>
                        <td th:text="${b.address}">Home</td>
                    </tr>
                    <tr>
                        <th>Rate per item</th>
                        <td>₹<span th:text="${b.ratePerItem}">1500</span></td>
                    </tr>
                    <tr>
                        <th>Total Amount</th>
                        <td>₹<span th:text="${b.totalAmount}">4500</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

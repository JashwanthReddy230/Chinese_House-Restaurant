<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Item</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Edit Item</h3>
                </div>
                <div class="card-body">

                    <form th:action="@{/update-item}" method="post" enctype="multipart/form-data">
                        <input type="hidden" name="id" th:value="${item.id}" />

                        <div class="mb-3">
                            <label class="form-label">Dish Name</label>
                            <input type="text" class="form-control" name="name" th:value="${item.dishname}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="4" required
                                      th:text="${item.description}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" class="form-control" name="category" th:value="${item.category}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Price (₹)</label>
                            <input type="number" class="form-control" name="price" th:value="${item.price}" step="0.01" required>
                        </div>
						<div class="mb-3">
						    <label class="form-label">Current Image</label><br>
						    <img th:src="@{${item.imgUrl}}" alt="Item Image" class="img-fluid rounded mb-2" style="max-height: 200px;">
						    
						    <label class="form-label">Change Image (optional)</label>
						    <input type="file" class="form-control" name="imageFile">
						</div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
                            <button type="submit" class="btn btn-success">Update Item</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS (optional for interactivity) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

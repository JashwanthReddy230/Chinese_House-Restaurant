<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese House - Forgot Password</title>
  <meta property="og:title" content="Chinese House - Restaurant">
  <meta property="og:description" content="Chinese House">
  <meta name="author" content="JashwanthReddy">
  <meta content="Chinese House" name="description">
  <link th:href="@{/logo-img/Chinese House logo-svg.png}" rel="icon">
  
  
  <link th:href="@{/css/forgotpassword.css}" rel="stylesheet">

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet">

  <!-- Icon Font Stylesheet -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
   
  </style>
</head>
<body>
  <div class="background">
    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>
  </div>
  
  <div class="decoration">🏮</div>
  <div class="decoration">🌸</div>
  <div class="decoration">🎋</div>
  <div class="decoration">✨</div>

  <div class="container">
    <div class="logo">Chinese House</div>
    <div class="subtitle">Authentic Chinese Cuisine</div>
    
    <h2><i class="fas fa-lock" style="color: #e94560; margin-right: 10px;"></i>Forgot Password?</h2>
    <p>No worries! Enter your registered email address and we'll send you a link to reset your password.</p>
    
    <form id="forgotForm">
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="Enter your email address" required>
      </div>
      <button type="submit">
        <span id="buttonText">Send Reset Link</span>
      </button>
    </form>
    
    <div class="loading" id="loading">
      <div class="spinner"></div>
      Sending reset link...
    </div>
    
    <a th:href="@{/login}" onclick="goToLogin()">
      <i class="fas fa-arrow-left"></i> Back to Login
    </a>
    
    <div class="message" id="successMsg">
      <i class="fas fa-check-circle"></i> Reset link sent successfully! Please check your email.
    </div>
    <div class="error" id="errorMsg">
      <i class="fas fa-exclamation-circle"></i> Please enter a valid email address.
    </div>
  </div>

  <script>
    const form = document.getElementById("forgotForm");
    const emailInput = document.getElementById("email");
    const successMsg = document.getElementById("successMsg");
    const errorMsg = document.getElementById("errorMsg");
    const loading = document.getElementById("loading");
    const buttonText = document.getElementById("buttonText");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const email = emailInput.value.trim();

      // Hide all messages
      successMsg.style.display = "none";
      errorMsg.style.display = "none";

      // Basic email validation
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        errorMsg.style.display = "block";
        emailInput.focus();
        return;
      }

      // Show loading state
      loading.style.display = "block";
      buttonText.textContent = "Sending...";
      form.querySelector('button').disabled = true;

      // Simulate API request (2 sec delay)
      setTimeout(() => {
        loading.style.display = "none";
        buttonText.textContent = "Send Reset Link";
        form.querySelector('button').disabled = false;
        
        successMsg.style.display = "block";
        emailInput.value = "";
        
        // Auto-hide success message after 5 seconds
        setTimeout(() => {
          successMsg.style.display = "none";
        }, 5000);
      }, 2000);
    });

    // Enhanced email validation on input
    emailInput.addEventListener('input', function() {
      if (errorMsg.style.display === "block") {
        errorMsg.style.display = "none";
      }
    });

    function goToLogin() {
      // Replace with actual login page URL
      alert("Redirecting to login page...");
      // window.location.href = "/login";
    }

    // Add some interactive effects
    document.addEventListener('mousemove', function(e) {
      const decorations = document.querySelectorAll('.decoration');
      decorations.forEach((decoration, index) => {
        const speed = (index + 1) * 0.01;
        const x = (e.clientX * speed) - (window.innerWidth * speed / 2);
        const y = (e.clientY * speed) - (window.innerHeight * speed / 2);
        decoration.style.transform = `translate(${x}px, ${y}px) scale(1.2)`;
      });
    });
  </script>
</body>
</html>
